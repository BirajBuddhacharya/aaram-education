    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

            while (true) {
              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

16px;font-weight:{{ n.weight }};padding:8px 12px;cursor:pointer;text-decoration:{{ n.deco }};text-underline-offset:8px;text-decoration-thickness:2px;text-decoration-color:#F2B233\" style-hover=\"color:#1D2B2A\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <button sc-camel-on-click=\"{{ go.dashboard }}\" style=\"white-space:nowrap;border:1px solid #DDE4DF;background:#fff;font-size:15px;font-weight:600;padding:5px 14px 5px 5px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#1D2B2A\">\n          <span style=\"width:30px;height:30px;border-radius:50%;background:#FCEFD2;color:#7A5300;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">SC<\u002Fspan>\n          Sameer\n        <\u002Fbutton>\n        <button sc-camel-on-click=\"{{ signOut }}\" style=\"white-space:nowrap;border:0;background:transparent;font-size:15px;color:#4F5E5B;cursor:pointer\">Sign out<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:center;gap:6px\">\n        <button sc-camel-on-click=\"{{ go.signin }}\" style=\"white-space:nowrap;border:0;background:transparent;font-size:16px;font-weight:600;padding:8px 12px;cursor:pointer;color:#1D2B2A\">Sign in<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.register }}\" style=\"white-space:nowrap;border:0;background:#2F6B5A;color:#fff;font-size:16px;font-weight:600;padding:10px 18px;border-radius:12px;cursor:pointer\" style-hover=\"background:#24574A\">Join free<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"flex:1\">\n\n<!-- HOME -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Home\">\n  <section style=\"max-width:1200px;margin:0 auto;padding:80px 28px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <h1 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(46px,7vw,84px);line-height:0.96;letter-spacing:-0.035em;text-wrap:balance\">Learn in the time you have.<\u002Fh1>\n      <p style=\"margin:0;font-size:20px;line-height:1.55;color:#4F5E5B;max-width:30em;text-wrap:pretty\">Short lessons in maths, science, English and computing, with notes to keep, quizzes that explain your mistakes, and a tutor for when you're stuck.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ go.lesson }}\" style=\"white-space:nowrap;border:0;background:#2F6B5A;color:#fff;font-size:17px;font-weight:600;padding:15px 24px;border-radius:14px;cursor:pointer\" style-hover=\"background:#24574A\">Try a free lesson<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ go.courses }}\" style=\"white-space:nowrap;border:1.5px solid #1D2B2A;background:transparent;color:#1D2B2A;font-size:17px;font-weight:600;padding:14px 22px;border-radius:14px;cursor:pointer\" style-hover=\"background:#fff\">See all courses<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:15px;color:#6B7A77\">No timetable and no tutor fees. Free samples open without an account.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:22px;box-shadow:0 1px 0 #DDE4DF, 0 24px 48px -24px rgb(29 43 42 / 0.25)\">\n      <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n        <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.02em\">I have<\u002Fspan>\n        <div style=\"display:flex;gap:6px;background:#F5F7F3;padding:5px;border-radius:14px\">\n          <sc-for list=\"{{ timeOpts }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"white-space:nowrap;border:0;background:{{ t.bg }};color:{{ t.color }};box-shadow:{{ t.shadow }};font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:600;padding:6px 16px;border-radius:10px;cursor:pointer\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:600;letter-spacing:-0.02em\">minutes<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ fitLessons }}\" as=\"l\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ go.lesson }}\" style=\"text-align:left;border:0;border-top:1px solid #DDE4DF;background:transparent;padding:14px 4px;display:grid;grid-template-columns:12px 1fr auto;gap:14px;align-items:center;cursor:pointer;color:#1D2B2A\" style-hover=\"background:#F5F7F3\">\n            <span style=\"width:12px;height:12px;border-radius:4px;background:{{ l.color }}\"><\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;line-height:1.35;min-width:0\">\n              <span style=\"font-weight:600;font-size:17px\">{{ l.title }}<\u002Fspan>\n              <span style=\"font-size:14px;color:#6B7A77\">{{ l.course }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"white-space:nowrap;font-size:15px;color:#4F5E5B\">{{ l.mins }} min<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;color:#6B7A77\">{{ fitNote }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#fff;border-top:1px solid #DDE4DF;border-bottom:1px solid #DDE4DF\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:88px 28px;display:flex;flex-direction:column;gap:48px\">\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(32px,4vw,44px);line-height:1.05;letter-spacing:-0.025em;max-width:16em;text-wrap:balance\">Every topic, four ways in. Use as many as you need.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px 32px;position:relative\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;border-top:2px solid {{ s.line }};padding-top:20px\">\n            <span style=\"width:36px;height:36px;border-radius:50%;background:{{ s.dot }};color:{{ s.dotInk }};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px\">{{ s.n }}<\u002Fspan>\n            <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:24px;letter-spacing:-0.015em;line-height:1.15\">{{ s.title }}<\u002Fdiv>\n            <p style=\"margin:0;color:#4F5E5B;font-size:16px;line-height:1.6;max-width:26em;text-wrap:pretty\">{{ s.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:88px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(32px,4vw,44px);line-height:1.05;letter-spacing:-0.025em\">Subjects<\u002Fh2>\n      <p style=\"margin:0;color:#4F5E5B;font-size:17px;max-width:22em\">The four subjects students ask for help with most. More are on the way.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"grid-column:span 2;display:flex;flex-direction:column;min-width:0\">\n      <sc-for list=\"{{ subjects }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ s.open }}\" style=\"text-align:left;border:0;border-bottom:1px solid #DDE4DF;background:transparent;padding:22px 4px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;cursor:pointer;color:#1D2B2A\" style-hover=\"background:#fff\">\n          <span style=\"width:14px;height:44px;border-radius:7px;background:{{ s.color }}\"><\u002Fspan>\n          <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n            <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(24px,3vw,32px);letter-spacing:-0.02em;line-height:1.1\">{{ s.name }}<\u002Fspan>\n            <span style=\"font-size:15px;color:#4F5E5B\">{{ s.topics }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"white-space:nowrap;font-size:15px;color:#4F5E5B\">{{ s.meta }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:#E3EEE8\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:88px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:48px\">\n      <sc-for list=\"{{ audiences }}\" as=\"a\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:26px;letter-spacing:-0.02em;line-height:1.15\">{{ a.title }}<\u002Fdiv>\n          <p style=\"margin:0;color:#2E3D3B;font-size:17px;line-height:1.6;max-width:26em;text-wrap:pretty\">{{ a.body }}<\u002Fp>\n          <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"align-self:flex-start;white-space:nowrap;border:0;background:transparent;padding:0;color:#24574A;font-size:16px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px\">{{ a.cta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:96px 28px;display:flex;flex-direction:column;gap:24px\">\n    <blockquote style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:500;font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-0.025em;max-width:22em;text-wrap:balance\">“I came back to maths after fifteen years to help my daughter. Nobody rushed me.”<\u002Fblockquote>\n    <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:16px;color:#4F5E5B\">\n      <span>Ramesh T., from the guest book<\u002Fspan>\n      <button sc-camel-on-click=\"{{ go.guestbook }}\" style=\"white-space:nowrap;border:0;background:transparent;padding:0;color:#24574A;font-size:16px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px\">Read more messages<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:0 28px 96px\">\n    <div style=\"background:#2F6B5A;color:#fff;border-radius:32px;padding:clamp(32px,5vw,64px);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n      <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1;letter-spacing:-0.03em;max-width:12em\">Five minutes is enough to start.<\u002Fh2>\n      <button sc-camel-on-click=\"{{ go.lesson }}\" style=\"white-space:nowrap;border:0;background:#F2B233;color:#1D2B2A;font-size:17px;font-weight:700;padding:16px 26px;border-radius:14px;cursor:pointer\" style-hover=\"background:#F7C455\">Try a free lesson<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- COURSES -->\n<sc-if value=\"{{ isCourses }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Courses\" style=\"max-width:1200px;margin:0 auto;padding:56px 28px 96px;display:flex;flex-direction:column;gap:32px\">\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-size:15px;color:#6B7A77;display:flex;gap:8px;white-space:nowrap\"><span sc-camel-on-click=\"{{ go.home }}\" style=\"cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Home<\u002Fspan><span>/<\u002Fspan><span style=\"color:#1D2B2A\">Courses<\u002Fspan><\u002Fdiv>\n    <h1 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(40px,5vw,60px);line-height:1;letter-spacing:-0.03em\">Courses<\u002Fh1>\n    <p style=\"margin:0;color:#4F5E5B;font-size:18px;max-width:34em\">Every course is split into lessons of 5 to 10 minutes. Stop whenever you like and pick up where you left off.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n    <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"white-space:nowrap;border:1.5px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }};font-size:15px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n    <label style=\"white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:10px;font-size:15px;color:#2E3D3B;cursor:pointer\">\n      <input type=\"checkbox\" checked=\"{{ freeOnly }}\" sc-camel-on-change=\"{{ toggleFree }}\" style=\"accent-color:#2F6B5A;width:18px;height:18px\">\n      Free samples only\n    <\u002Flabel>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px\">\n    <sc-for list=\"{{ courseList }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <div sc-camel-on-click=\"{{ c.open }}\" style=\"background:#fff;border-radius:20px;padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:14px;border:1px solid #DDE4DF\" style-hover=\"border-color:#1D2B2A\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n          <span style=\"display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#4F5E5B;white-space:nowrap\"><span style=\"width:10px;height:10px;border-radius:3px;background:{{ c.color }}\"><\u002Fspan>{{ c.subject }}<\u002Fspan>\n          <sc-if value=\"{{ c.free }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"white-space:nowrap;font-size:13px;font-weight:700;color:#7A5300;background:#FCEFD2;padding:3px 10px;border-radius:999px\">Free sample<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:23px;line-height:1.15;letter-spacing:-0.015em\">{{ c.title }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;color:#4F5E5B;line-height:1.55;flex:1\">{{ c.blurb }}<\u002Fp>\n        <div style=\"font-size:14px;color:#6B7A77\">{{ c.meta }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ noCourses }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:1.5px dashed #C9D3CD;border-radius:20px;padding:40px;text-align:center;color:#4F5E5B\">No free samples in this subject yet. Turn off the filter to see every course.<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- LESSON -->\n<sc-if value=\"{{ isLesson }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Lesson\" style=\"max-width:1200px;margin:0 auto;padding:36px 28px 96px;display:flex;flex-direction:column;gap:24px\">\n  <div style=\"font-size:15px;color:#6B7A77;display:flex;gap:8px;flex-wrap:wrap;white-space:nowrap\">\n    <span sc-camel-on-click=\"{{ go.courses }}\" style=\"cursor:pointer;text-decoration:underline;text-underline-offset:3px\">Courses<\u002Fspan><span>/<\u002Fspan><span>Mathematics<\u002Fspan><span>/<\u002Fspan><span>Algebra Foundations<\u002Fspan><span>/<\u002Fspan><span style=\"color:#1D2B2A\">{{ currentLesson.title }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:32px;align-items:start\">\n    <div style=\"grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"aspect-ratio:16/9;border-radius:24px;background:#1D2B2A;position:relative;display:flex;align-items:center;justify-content:center\">\n        <div style=\"width:76px;height:76px;border-radius:50%;background:#F2B233;display:flex;align-items:center;justify-content:center;color:#1D2B2A\">\n          <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"8 4 20 12 8 20 8 4\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:center;gap:14px;font-size:14px;color:#C9D3CD;white-space:nowrap\">\n          <span>0:00<\u002Fspan>\n          <div style=\"flex:1;height:4px;border-radius:4px;background:rgb(255 255 255 / 0.2)\"><\u002Fdiv>\n          <span>{{ currentLesson.mins }}:00<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:15px;color:#4F5E5B\">Lesson {{ currentLesson.num }} of 7, {{ currentLesson.mins }} minutes, with Ms. Suprava<\u002Fspan>\n          <h1 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(30px,4vw,42px);line-height:1.05;letter-spacing:-0.025em\">{{ currentLesson.title }}<\u002Fh1>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ nextLesson }}\" style=\"white-space:nowrap;border:1.5px solid #1D2B2A;background:transparent;font-size:15px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;color:#1D2B2A\" style-hover=\"background:#fff\">Next lesson<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:6px;background:#E8EDE9;padding:5px;border-radius:14px;align-self:flex-start\">\n        <sc-for list=\"{{ lessonTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"white-space:nowrap;border:0;background:{{ t.bg }};box-shadow:{{ t.shadow }};font-size:15px;font-weight:600;padding:8px 18px;border-radius:10px;cursor:pointer;color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ tabNotes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:40em\">\n          <p style=\"margin:0;color:#2E3D3B;font-size:18px;line-height:1.7\">A linear equation has one unknown and no powers. To solve it, undo each operation in reverse order, and do the same thing to both sides so the equation stays balanced.<\u002Fp>\n          <ol style=\"margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:10px;font-size:17px;color:#2E3D3B\">\n            <sc-for list=\"{{ keySteps }}\" as=\"k\" hint-placeholder-count=\"3\"><li style=\"padding-left:6px\">{{ k.t }}<\u002Fli><\u002Fsc-for>\n          <\u002Fol>\n          <div style=\"font-family:'Atkinson Hyperlegible Mono',monospace;font-size:17px;background:#fff;border-radius:16px;padding:20px 24px;line-height:2;color:#1D2B2A;border:1px solid #DDE4DF\">3x + 5 = 20<br>3x = 15 <span style=\"color:#6B7A77\">  subtract 5 from both sides<\u002Fspan><br>x = 5 <span style=\"color:#6B7A77\">   divide both sides by 3<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button style=\"white-space:nowrap;border:0;background:#2F6B5A;color:#fff;font-size:16px;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px\" style-hover=\"background:#24574A\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"><\u002Fline><\u002Fsvg>\n              Download notes (PDF, 240 KB)\n            <\u002Fbutton>\n            <button sc-camel-on-click=\"{{ showQuiz }}\" style=\"white-space:nowrap;border:1.5px solid #1D2B2A;background:transparent;font-size:16px;font-weight:600;padding:11px 18px;border-radius:12px;cursor:pointer;color:#1D2B2A\">Check what you learned<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:40em\">\n          <p style=\"margin:0;color:#4F5E5B;font-size:16px\">There's no timer. Pick an answer and you'll see why it's right or wrong.<\u002Fp>\n          <sc-for list=\"{{ quiz }}\" as=\"q\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid #DDE4DF\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-size:15px;font-weight:700;color:#6B7A77\">{{ q.n }}.<\u002Fspan><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;letter-spacing:-0.01em;line-height:1.25\">{{ q.q }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px\">\n                <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"text-align:left;border:1.5px solid {{ o.border }};background:{{ o.bg }};color:#1D2B2A;font-size:17px;font-weight:500;padding:13px 16px;border-radius:12px;cursor:{{ o.cursor }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ q.answered }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:16px;color:{{ q.fbColor }};background:{{ q.fbBg }};padding:12px 16px;border-radius:12px\"><strong>{{ q.fbTitle }}<\u002Fstrong> {{ q.explain }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ quizDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-radius:20px;padding:24px;background:#FCEFD2;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n              <div><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:24px;letter-spacing:-0.015em\">{{ score }} out of 3<\u002Fdiv><div style=\"font-size:16px;color:#4F5E5B\">{{ scoreNote }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ resetQuiz }}\" style=\"white-space:nowrap;border:1.5px solid #1D2B2A;background:transparent;font-size:15px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer;color:#1D2B2A\">Try again<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ nextLesson }}\" style=\"white-space:nowrap;border:0;background:#2F6B5A;color:#fff;font-size:15px;font-weight:600;padding:11px 16px;border-radius:12px;cursor:pointer\">Next lesson<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <aside style=\"display:flex;flex-direction:column;gap:20px;min-width:0;position:sticky;top:96px\">\n      <div style=\"background:#fff;border-radius:20px;overflow:hidden;border:1px solid #DDE4DF\">\n        <div style=\"padding:20px 20px 16px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.01em\">Algebra Foundations<\u002Fdiv>\n          <div style=\"height:8px;background:#E8EDE9;border-radius:999px;overflow:hidden\"><div style=\"width:43%;height:100%;background:#F2B233;border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:14px;color:#4F5E5B\">3 of 7 lessons done<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ lessons }}\" as=\"l\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"width:100%;text-align:left;border:0;border-top:1px solid #DDE4DF;background:{{ l.bg }};padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;color:#1D2B2A\" style-hover=\"background:#F5F7F3\">\n            <span style=\"width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:{{ l.dotBg }};color:{{ l.dotColor }};border:1.5px solid {{ l.dotBorder }}\">{{ l.mark }}<\u002Fspan>\n            <span style=\"flex:1;font-size:15px;font-weight:{{ l.weight }}\">{{ l.title }}<\u002Fspan>\n            <span style=\"white-space:nowrap;font-size:14px;color:#6B7A77\">{{ l.mins }} min<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:10px;background:#E3EEE8\">\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.01em\">Still stuck?<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;color:#2E3D3B\">Book a one-to-one session and go through it with a tutor.<\u002Fp>\n        <button sc-camel-on-click=\"{{ go.dashboard }}\" style=\"align-self:flex-start;white-space:nowrap;border:0;background:#1D2B2A;color:#fff;font-size:15px;font-weight:600;padding:10px 16px;border-radius:12px;cursor:pointer\">Book a tutor<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- DASHBOARD -->\n<sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Dashboard\      <span sc-camel-on-click=\"{{ go.register }}\" style=\"cursor:pointer\" style-hover=\"color:#fff\">Teach on Aaram<\u002Fspan>\n      <span sc-camel-on-click=\"{{ go.home }}\" style=\"cursor:pointer\" style-hover=\"color:#fff\">About us<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1200px;margin:0 auto;padding:20px 28px 36px;font-size:14px;color:#8FA09B;border-top:1px solid #34443F\">© 2026 Aaram Education, Techspire College<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;courses&quot;,&quot;lesson&quot;,&quot;dashboard&quot;,&quot;guestbook&quot;,&quot;signin&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst SUBJ = {\n  Mathematics: { color: '#2F6B5A', topics: 'Algebra, trigonometry, geometry' },\n  Science: { color: '#37708C', topics: 'Physics, chemistry, biology' },\n  English: { color: '#7A5C8C', topics: 'Essays, grammar, reading' },\n  Computing: { color: '#C98A1B', topics: 'Python, web basics' },\n};\nconst COURSES = [\n  { title: 'Algebra Foundations', subject: 'Mathematics', lessons: 7, level: 'Beginner', tutor: 'Suprava M.', free: true, blurb: 'Equations, balancing and word problems, one small step at a time.' },\n  { title: 'Trigonometry Basics', subject: 'Mathematics', lessons: 9, level: 'Intermediate', tutor: 'Biraj B.', free: false, blurb: 'Sine, cosine and tangent explained with simple diagrams.' },\n  { title: 'Motion and Forces', subject: 'Science', lessons: 8, level: 'Beginner', tutor: 'Ayus Y.', free: true, blurb: 'Speed, acceleration and Newton\\u2019s laws through everyday examples.' },\n  { title: 'Atoms and Bonding', subject: 'Science', lessons: 10, level: 'Intermediate', tutor: 'Ayus Y.', free: false, blurb: 'What matter is made of and why elements join together.' },\n  { title: 'Essay Writing', subject: 'English', lessons: 6, level: 'All levels', tutor: 'Suprava M.', free: true, blurb: 'Plan, structure and polish essays for exams and coursework.' },\n  { title: 'Grammar Essentials', subject: 'English', lessons: 8, level: 'Beginner', tutor: 'Biraj B.', free: false, blurb: 'Tenses, punctuation and sentence structure without the jargon.' },\n  { title: 'Programming with Python', subject: 'Computing', lessons: 12, level: 'Beginner', tutor: 'Sameer C.', free: true, blurb: 'Variables, loops and functions. Write your first real programs.' },\n  { title: 'Web Basics: HTML and CSS', subject: 'Computing', lessons: 9, level: 'Beginner', tutor: 'Sameer C.', free: false, blurb: 'Build and style a simple web page from scratch.' },\n];\nconst QUICK = [\n  { title: 'One-step equations', course: 'Algebra Foundations', subject: 'Mathematics', mins: 5 },\n  { title: 'Commas that change meaning', course: 'Grammar Essentials', subject: 'English', mins: 5 },\n  { title: 'What is a variable?', course: 'Programming with Python', subject: 'Computing', mins: 5 },\n  { title: 'Speed or velocity?', course: 'Motion and Forces', subject: 'Science', mins: 7 },\n  { title: 'Solving linear equations', course: 'Algebra Foundations', subject: 'Mathematics', mins: 8 },\n  { title: 'A strong opening line', course: 'Essay Writing', subject: 'English', mins: 9 },\n  { title: 'Loops in Python', course: 'Programming with Python', subject: 'Computing', mins: 10 },\n  { title: 'Newton\\u2019s first law, with a quiz', course: 'Motion and Forces', subject: 'Science', mins: 14 },\n  { title: 'Plan an essay in three moves', course: 'Essay Writing', subject: 'English', mins: 12 },\n  { title: 'Equations with brackets, with a quiz', course: 'Algebra Foundations', subject: 'Mathematics', mins: 15 },\n];\nconst LESSONS = [\n  ['What is an equation?', 6], ['Balancing both sides', 7], ['One-step equations', 5], ['Solving linear equations', 8],\n  ['Equations with brackets', 9], ['Fractions in equations', 8], ['Word problems', 10],\n];\nconst QUIZ = [\n  { q: 'Solve 3x + 5 = 20', opts: ['x = 3', 'x = 5', 'x = 15', 'x = 25/3'], a: 1, explain: 'Subtract 5 to get 3x = 15, then divide by 3.' },\n  { q: 'If x \\u00f7 4 = 7, what is x?', opts: ['1.75', '3', '11', '28'], a: 3, explain: 'Undo the division by multiplying both sides by 4.' },\n  { q: 'Which equation has the solution x = \\u22122?', opts: ['x + 5 = 3', '2x = 4', 'x \\u2212 2 = 0', '3x = 6'], a: 0, explain: '\\u22122 + 5 = 3, so both sides balance.' },\n];\nconst SLOTS = ['Thu 4:00 pm', 'Thu 6:30 pm', 'Sat 10:00 am', 'Sat 2:00 pm'];\n\nclass Component extends DCLogic {\n  state = {\n    page: this.props.startPage ?? 'home',\n    signedIn: this.props.signedIn ?? false,\n    minutes: 10,\n    subject: 'All', freeOnly: false,\n    lessonIdx: 3, tab: 'notes', answers: {},\n    slot: null, booked: false,\n    gbName: '', gbMsg: '', gbTried: false, gbSent: false,\n    entries: [\n      { name: 'Anisha K.', date: '18 September 2026', msg: 'The five-minute lessons fit between classes. I finally understand simultaneous equations.' },\n      { name: 'Ramesh T.', date: '12 September 2026', msg: 'I came back to maths after fifteen years to help my daughter. Nobody rushed me.' },\n      { name: 'Priya S.', date: '4 September 2026', msg: 'The quizzes tell you why an answer is wrong, not just that it is. That changed a lot for me.' },\n    ],\n    authMode: 'signin', role: 'Student', fName: '', fEmail: '', fPw: '', errors: {},\n  };\n\n  go(page) {\n    if (page === 'dashboard' && !this.state.signedIn) page = 'signin';\n    const patch = { page };\n    if (page === 'register') { patch.page = 'signin'; patch.authMode = 'register'; }\n    if (page === 'signin') patch.errors = {};\n    this.setState(patch);\n    window.scrollTo(0, 0);\n  }\n\n  submitAuth() {\n    const { authMode, fName, fEmail, fPw } = this.state;\n    const e = {};\n    if (authMode === 'register' && !fName.trim()) e.name = 'Enter your full name.';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(fEmail)) e.email = 'Enter an email address like name@example.com.';\n    if (fPw.length < 8) e.pw = 'Use at least 8 characters.';\n    else if (authMode === 'register' && !/\\d/.test(fPw)) e.pw = 'Add at least one number.';\n    if (Object.keys(e).length) return this.setState({ errors: e });\n    this.setState({ signedIn: true, page: 'dashboard', errors: {}, fPw: '' });\n    window.scrollTo(0, 0);\n  }\n\n  submitGb() {\n    const { gbName, gbMsg } = this.state;\n    if (!gbName.trim() || gbMsg.trim().length < 10) return this.setState({ gbTried: true, gbSent: false });\n    this.setState(s => ({\n      entries: [{ name: gbName.trim(), date: 'Just now', msg: gbMsg.trim(), pending: true }, ...s.entries],\n      gbName: '', gbMsg: '', gbTried: false, gbSent: true,\n    }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const go = {};\n    ['home', 'courses', 'lesson', 'dashboard', 'guestbook', 'signin', 'register'].forEach(p => go[p] = () => this.go(p));\n    const navDefs = [['Courses', 'courses'], ['Free lesson', 'lesson'], ['Guest book', 'guestbook']];\n    if (s.signedIn) navDefs.push(['Dashboard', 'dashboard']);\n    const navItems = navDefs.map(([label, p]) => {\n      const on = s.page === p;\n      return { label, onClick: go[p], color: on ? '#1D2B2A' : '#4F5E5B', weight: on ? 700 : 500, deco: on ? 'underline' : 'none' };\n    });\n\n    const timeOpts = [5, 10, 15].map(m => {\n      const on = s.minutes === m;\n      return { label: String(m), onClick: () => this.setState({ minutes: m }),\n        bg: on ? '#F2B233' : 'transparent', color: on ? '#1D2B2A' : '#4F5E5B', shadow: on ? '0 1px 2px rgb(29 43 42 / 0.15)' : 'none' };\n    });\n    const fitLessons = QUICK.filter(l => l.mins <= s.minutes).sort((a, b) => b.mins - a.mins).slice(0, 4)\n      .map(l => ({ ...l, color: SUBJ[l.subject].color }));\n    const fitNote = { 5: 'Enough for one short lesson. Your place is saved when you stop.', 10: 'Enough for a full lesson and a look at the notes.', 15: 'Enough for a lesson and its practice quiz.' }[s.minutes];\n\n    const subjects = Object.keys(SUBJ).map(name => ({\n      name, ...SUBJ[name],\n      meta: COURSES.filter(c => c.subject === name).reduce((n, c) => n + c.lessons, 0) + ' lessons',\n      open: () => { this.setState({ subject: name, page: 'courses' }); window.scrollTo(0, 0); },\n    }));\n    const chips = ['All', ...Object.keys(SUBJ)].map(label => {\n      const on = s.subject === label;\n      return { label, onClick: () => this.setState({ subject: label }),\n        bg: on ? '#1D2B2A' : 'transparent', color: on ? '#fff' : '#2E3D3B', border: on ? '#1D2B2A' : '#C9D3CD' };\n    });\n    const courseList = COURSES\n      .filter(c => (s.subject === 'All' || c.subject === s.subject) && (!s.freeOnly || c.free))\n      .map(c => ({ ...c, color: SUBJ[c.subject].color, meta: `${c.lessons} lessons, ${c.level.toLowerCase()}, taught by ${c.tutor}`,\n        open: () => { this.setState({ page: 'lesson', lessonIdx: 3, tab: 'notes' }); window.scrollTo(0, 0); } }));\n\n    const lessons = LESSONS.map(([title, mins], i) => {\n      const done = i < 3, cur = i === s.lessonIdx;\n      return { title, mins, onClick: () => this.setState({ lessonIdx: i, tab: 'notes', answers: {} }),\n        mark: done ? '\\u2713' : String(i + 1),\n        bg: cur ? '#FCEFD2' : '#fff', weight: cur ? 700 : 400,\n        dotBg: done ? '#2F6B5A' : '#fff', dotColor: done ? '#fff' : (cur ? '#7A5300' : '#6B7A77'),\n        dotBorder: done ? '#2F6B5A' : (cur ? '#C98A1B' : '#C9D3CD') };\n    });\n    const currentLesson = { title: LESSONS[s.lessonIdx][0], mins: LESSONS[s.lessonIdx][1], num: s.lessonIdx + 1 };\n    const lessonTabs = [['Notes', 'notes'], ['Practice quiz', 'quiz']].map(([label, t]) => {\n      const on = s.tab === t;\n      return { label, onClick: () => this.setState({ tab: t }),\n        bg: on ? '#fff' : 'transparent', shadow: on ? '0 1px 2px rgb(29 43 42 / 0.15)' : 'none', color: on ? '#1D2B2A' : '#4F5E5B' };\n    });\n\n    const quiz = QUIZ.map((q, qi) => {\n      const pick = s.answers[qi], answered = pick !== undefined, right = pick === q.a;\n      return {\n        n: qi + 1, q: q.q, explain: q.explain, answered,\n        fbTitle: right ? 'Right.' : 'Not this time.',\n        fbColor: right ? '#1F4F42' : '#8A3421', fbBg: right ? '#E3EEE8' : '#F8E6E1',\n        opts: q.opts.map((label, oi) => {\n          let bg = '#fff', border = '#DDE4DF';\n          if (answered && oi === q.a) { bg = '#E3EEE8'; border = '#2F6B5A'; }\n          else if (answered && oi === pick) { bg = '#F8E6E1'; border = '#B5462F'; }\n          return { label, bg, border, cursor: answered ? 'default' : 'pointer',\n            onClick: () => { if (!answered) this.setState(st => ({ answers: { ...st.answers, [qi]: oi } })); } };\n        }),\n      };\n    });\n    const score = QUIZ.filter((q, i) => s.answers[i] === q.a).length;\n    const quizDone = Object.keys(s.answers).length === QUIZ.length;\n\n    const slots = SLOTS.map(label => {\n      const on = s.slot === label;\n      return { label, onClick: () => this.setState({ slot: label, booked: false }),\n        bg: on ? '#fff' : 'transparent', border: on ? '#1D2B2A' : '#A9C4B8' };\n    });\n\n    const e = s.errors, isReg = s.authMode === 'register';\n    const gbNameErr = s.gbTried && !s.gbName.trim();\n    const gbMsgErr = s.gbTried && s.gbMsg.trim().length < 10;\n\n    return {\n      go, navItems, signedIn: s.signedIn, signedOut: !s.signedIn,\n      signOut: () => { this.setState({ signedIn: false, page: 'home' }); window.scrollTo(0, 0); },\n      isHome: s.page === 'home', isCourses: s.page === 'courses', isLesson: s.page === 'lesson',\n      isDashboard: s.page === 'dashboard', isGuestbook: s.page === 'guestbook', isAuth: s.page === 'signin',\n\n      timeOpts, fitLessons, fitNote,\n      steps: [\n        { n: '1', title: 'Watch', body: 'A 5 to 10 minute video explains the idea. Pause it, rewind it, or come back tomorrow.', line: '#1D2B2A', dot: '#1D2B2A', dotInk: '#fff' },\n        { n: '2', title: 'Read', body: 'A one-page summary of the key points. Print it or keep it for revision offline.', line: '#1D2B2A', dot: '#1D2B2A', dotInk: '#fff' },\n        { n: '3', title: 'Check', body: 'A few practice questions with instant feedback that explains every answer.', line: '#1D2B2A', dot: '#1D2B2A', dotInk: '#fff' },\n        { n: '4', title: 'Ask', body: 'Still stuck? Book a one-to-one session with a tutor at a time that suits you.', line: '#F2B233', dot: '#F2B233', dotInk: '#1D2B2A' },\n      ],\n      subjects,\n      audiences: [\n        { title: 'If you\\u2019re at school or college', body: 'Catch up on a class you missed, go over a topic again, or prepare for exams. You\\u2019ll always know which lesson comes next.', cta: 'Start with a free lesson', onClick: go.lesson },\n        { title: 'If you\\u2019re coming back to it', body: 'Brush up the basics to help your children or return to study. Jump straight to the section you need.', cta: 'Browse courses', onClick: go.courses },\n        { title: 'If you teach', body: 'Upload lessons and notes, write quizzes with simple forms, and see which students may need a hand.', cta: 'Apply to teach', onClick: go.register },\n      ],\n\n      chips, courseList, noCourses: courseList.length === 0, freeOnly: s.freeOnly,\n      toggleFree: () => this.setState(st => ({ freeOnly: !st.freeOnly })),\n\n      lessons, currentLesson, lessonTabs, tabNotes: s.tab === 'notes', tabQuiz: s.tab === 'quiz',\n      showQuiz: () => this.setState({ tab: 'quiz' }),\n      nextLesson: () => { this.setState(st => ({ lessonIdx: Math.min(st.lessonIdx + 1, LESSONS.length - 1), tab: 'notes', answers: {} })); window.scrollTo(0, 0); },\n      keySteps: [\n        { t: 'Move the numbers: add or subtract the same amount on both sides.' },\n        { t: 'Get x on its own: divide both sides by the number in front of it.' },\n        { t: 'Check: put your answer back into the original equation.' },\n      ],\n      quiz, score, quizDone,\n      scoreNote: score === 3 ? 'You\\u2019re ready for the next lesson.' : 'Look over the notes and try again whenever you like.',\n      resetQuiz: () => this.setState({ answers: {} }),\n\n      enrolled: [\n        { title: 'Algebra Foundations', color: SUBJ.Mathematics.color, pct: 43, done: '3 of 7 lessons', next: 'Solving linear equations' },\n        { title: 'Programming with Python', color: SUBJ.Computing.color, pct: 75, done: '9 of 12 lessons', next: 'Writing functions' },\n        { title: 'Essay Writing', color: SUBJ.English.color, pct: 17, done: '1 of 6 lessons', next: 'Planning your argument' },\n      ],\n      scores: [\n        { topic: 'One-step equations', score: '3 of 3', color: '#24574A' },\n        { topic: 'Python loops', score: '4 of 5', color: '#1D2B2A' },\n        { topic: 'Essay structure', score: '2 of 4', color: '#8A3421' },\n      ],\n      slots,\n      bookBg: s.booked ? '#fff' : (s.slot ? '#1D2B2A' : '#A9C4B8'),\n      bookInk: s.booked ? '#24574A' : '#fff',\n      bookLabel: s.booked ? 'Requested for ' + s.slot : (s.slot ? 'Request ' + s.slot : 'Pick a time first'),\n      book: () => { if (s.slot) this.setState({ booked: true }); },\n\n      gbName: s.gbName, gbMsg: s.gbMsg, gbSent: s.gbSent, gbNameErr,\n      setGbName: ev => this.setState({ gbName: ev.target.value, gbSent: false }),\n      setGbMsg: ev => this.setState({ gbMsg: ev.target.value.slice(0, 300), gbSent: false }),\n      gbNameBorder: gbNameErr ? '#B5462F' : '#DDE4DF',\n      gbMsgBorder: gbMsgErr ? '#B5462F' : '#DDE4DF',\n      gbCount: gbMsgErr ? 'Write at least 10 characters.' : s.gbMsg.length + ' of 300 characters',\n      gbCountColor: gbMsgErr ? '#B5462F' : '#6B7A77',\n      submitGb: () => this.submitGb(),\n      entries: s.entries,\n\n      isRegister: isReg,\n      authTitle: isReg ? 'Create your account' : 'Welcome back',\n      authSub: isReg ? 'It\\u2019s free, and you can learn at your own pace.' : 'Sign in to pick up where you left off.',\n      authCta: isReg ? 'Create account' : 'Sign in',\n      authSwitchText: isReg ? 'Already have an account?' : 'New to Aaram?',\n      authSwitchCta: isReg ? 'Sign in' : 'Create an account',\n      toggleAuth: () => this.setState({ authMode: isReg ? 'signin' : 'register', errors: {} }),\n      roles: ['Student', 'Tutor'].map(label => ({ label, onClick: () => this.setState({ role: label }),\n        bg: s.role === label ? '#fff' : 'transparent', shadow: s.role === label ? '0 1px 2px rgb(29 43 42 / 0.15)' : 'none' })),\n      fName: s.fName, fEmail: s.fEmail, fPw: s.fPw,\n      setFName: ev => this.setState({ fName: ev.target.value }),\n      setFEmail: ev => this.setState({ fEmail: ev.target.value }),\n      setFPw: ev => this.setState({ fPw: ev.target.value }),\n      err: {\n        name: e.name || '', email: e.email || '', pw: e.pw || '',\n        nameBorder: e.name ? '#B5462F' : '#DDE4DF',\n        emailBorder: e.email ? '#B5462F' : '#DDE4DF',\n        pwBorder: e.pw ? '#B5462F' : '#DDE4DF',\n      },\n      submitAuth: () => this.submitAuth(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
